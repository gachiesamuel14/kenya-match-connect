<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenya Match - Location Dating</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Kenya Match 🇰🇪</h1>
    <p>Connect with people nearby in Kenya</p>
  </header>
  <main id="app">
    <div class="profile-card" id="profile-card">
      <img id="profile-img" src="" alt="Profile">
      <div class="profile-info">
        <h2 id="profile-name"></h2>
        <p id="profile-age-county"></p>
        <p id="profile-bio"></p>
        <p id="profile-distance"></p>
      </div>
      <div class="actions">
        <button id="pass-btn" class="pass">Pass</button>
        <button id="like-btn" class="like">Like</button>
      </div>
    </div>
    <div id="matches" class="matches"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
